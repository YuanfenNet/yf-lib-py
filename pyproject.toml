[project]
    authors = [{ name = "Bean", email = "bean@yuanfen.net" }]
    classifiers = [
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        'Programming Language :: Python',
    ]
    dependencies = [
        "chardet~=7.7",
        "pydantic~=2.14",
        "pytz~=2026.6",
        "pyyaml~=6.0",
        "redis~=8.1",
        "requests~=2.34",
        "watchdog~=7.1",
    ]
    description = "Yuanfen Python Library"
    license = { text = "MIT" }
    name = "yuanfen"
    readme = "README.md"
    requires-python = ">=3.15.2"
    version = "0.0.0"

[project.urls]
    repository = "https://github.com/YuanfenNet/yf-lib-py"

[dependency-groups]
    dev = ["ruff>=0.17.4"]

[tool.ruff]
    line-length = 180
