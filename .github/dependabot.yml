version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    versioning-strategy: increase
    commit-message:
      prefix: chore
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
